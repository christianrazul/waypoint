[package]
name = "waypoint"
version = "0.1.0"
description = "Screen annotation and agenda sticky for presenters"
edition = "2021"
rust-version = "1.80"

[lib]
name = "waypoint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "=2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "=2.1.1"
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", features = ["NSString"] }
objc2-app-kit = { version = "=0.3.2", features = ["NSWorkspace", "NSRunningApplication"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
