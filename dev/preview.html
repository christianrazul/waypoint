<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Waypoint drawing preview</title>
    <style>
      body {
        position: fixed;
        inset: 0;
        margin: 0;
        background: #f3f5f9;
        color: #192230;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      .slide {
        position: absolute;
        inset: 0;
        padding: 150px 100px;
        box-sizing: border-box;
        pointer-events: none;
      }
      h1 {
        font-size: 38px;
        letter-spacing: -1.2px;
        margin: 0 0 12px;
      }
      p {
        color: #637083;
        font-size: 18px;
        margin: 0;
      }
      .diagram {
        display: flex;
        align-items: center;
        gap: 45px;
        margin-top: 120px;
        justify-content: center;
      }
      .box {
        padding: 30px 50px;
        background: white;
        border: 1px solid #d8dfe9;
        border-radius: 12px;
        font-size: 22px;
        box-shadow: 0 5px 20px #1c314908;
      }
      .flow {
        font-size: 30px;
        color: #97a6bb;
      }
      #overlay {
        position: absolute;
        inset: 0;
        width: 100vw;
        height: 100vh;
        border: 0;
      }
      #hotbar {
        position: absolute;
        top: 12px;
        right: 24px;
        width: 794px;
        height: 112px;
        border: 0;
      }
      #sticky {
        position: absolute;
        left: -8px;
        bottom: -16px;
        width: 556px;
        height: 416px;
        border: 0;
        visibility: hidden;
      }
      #setup {
        position: absolute;
        right: -56px;
        top: -64px;
        width: 592px;
        height: calc(min(650px, 100vh - 64px) + 192px);
        border: 0;
        visibility: hidden;
      }
      .controls {
        position: absolute;
        bottom: 18px;
        right: 24px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #637083;
      }
      button {
        border: 1px solid #d0d7e2;
        border-radius: 6px;
        background: white;
        padding: 7px 12px;
        color: #293549;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="slide">
      <h1>Architecture overview</h1>
      <p>Follow a request from the client to the services.</p>
      <div class="diagram">
        <div class="box">Client</div>
        <span class="flow">→</span>
        <div class="box">Gateway</div>
        <span class="flow">→</span>
        <div class="box">Services</div>
      </div>
    </div>
    <div class="controls">
      <button id="undo">Undo</button><button id="redo">Redo</button
      ><button id="clear">Clear</button
      ><button id="open-setup">Sticky setup</button
      ><button id="reset-agenda">Reset agenda</button
      ><span>Browser preview · native focus simulated</span>
    </div>
    <script type="module" src="/dev/preview.js"></script>
  </body>
</html>
