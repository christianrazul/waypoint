name: Windows installer
on:
  push:
    branches: [main, 'codex/m5-validation*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.13.0'
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.2
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - name: Select Rust
        run: rustup default 1.98.1
      - name: Cache Rust build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-1.98.1-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend tests
        run: pnpm test
      - name: Frontend build
        run: pnpm build
      - name: Native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Native lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-features -- -D warnings
      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: waypoint-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
